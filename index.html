<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07140f">
  <meta name="description" content="A guided solo and two-player companion for Kill Team missions in a Necron tomb world.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tomb World Guide">
  <title>Tomb World Battle Guide</title>
  <link rel="icon" href="Assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="Assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=9.2.29">
</head>
<body>
  <div id="gameBackground" aria-hidden="true"></div>
  <div class="ambient-grid" aria-hidden="true"></div>
  <header class="app-header">
    <div class="brand">
      <img src="Assets/icon.svg" alt="" class="brand-icon">
      <div><span>UNOFFICIAL TOMB WORLD PLAY AID</span><h1>Tomb World Battle Guide</h1></div>
    </div>
    <div class="header-actions">
      <button class="header-menu-btn" id="gameMenuBtn" hidden>Game Menu</button>
      <div class="version">V9.2.29</div>
      <button class="narration-speaker-btn" id="narrationSpeakerBtn" type="button" aria-label="Master audio on" aria-pressed="true" title="Master audio on">
        <svg class="narration-icon-enabled" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 8.5c1.3 1.8 1.3 5.2 0 7M19 6c2.7 3.2 2.7 8.8 0 12"></path></svg>
        <svg class="narration-icon-disabled" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="M16 9 L21 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path><path d="M21 9 L16 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
      </button>
      <button class="operative-status-toggle" id="operativeStatusToggle" type="button" aria-label="Show operative status" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.5" y="3.5" width="5" height="17" rx="1"></rect><rect x="10.5" y="3.5" width="11" height="17" rx="1"></rect></svg>
      </button>
    </div>
  </header>

  <div id="gameWorkspace" class="game-workspace">
    <aside id="operativeStatusPanel" class="operative-status-panel" aria-label="Operative status" hidden></aside>
    <main id="app" class="app-shell" aria-live="polite"></main>
  </div>


  <dialog id="modal" class="modal" aria-modal="true"><div id="modalBody"></div></dialog>
  <dialog id="diceEntryDialog" class="modal dice-entry-dialog" aria-modal="true" aria-labelledby="diceEntryTitle" aria-describedby="diceEntryInstruction">
    <div class="modal-inner dice-entry-inner">
      <h2 id="diceEntryTitle">Enter Dice Results</h2>
      <p id="diceEntryRoller" class="dice-entry-roller" hidden></p>
      <p id="diceEntryInstruction"></p>
      <div id="diceEntryResults" class="dice-row dice-entry-results" aria-label="Entered dice"></div>
      <p id="diceEntryProgress" class="dice-entry-progress" role="status" aria-live="polite">0 of 0 entered</p>
      <div id="diceEntryKeypad" class="dice-entry-keypad" aria-label="Die results"></div>
      <div class="wizard-actions dice-entry-actions">
        <button class="btn ghost" id="diceEntryUndo" type="button" disabled>Undo</button>
        <button class="btn primary" id="diceEntryCommit" type="button" disabled>Commit Results</button>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" hidden></div>
  <div id="offlineInstallStatus" class="offline-install-status" role="status" aria-live="polite" aria-atomic="true" hidden>
    <div class="offline-install-copy">
      <span id="offlineInstallMessage">Preparing for offline play…</span>
      <strong id="offlineInstallPercent">0%</strong>
    </div>
    <div id="offlineInstallProgress" class="offline-install-progress" role="progressbar" aria-label="Offline preparation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span></span>
    </div>
  </div>
  <div id="updateNotice" class="update-notice" role="status" hidden>
    <span>A new version is available.</span>
    <button class="btn primary" id="updateAppBtn" type="button">Update App</button>
  </div>
  <input id="importInput" type="file" accept="application/json" hidden>
  <script src="mission-engine.js?v=9.2.29"></script>
  <script src="persistence.js?v=9.2.29"></script>
  <script src="deadly-encounters.js?v=9.2.29"></script>
  <script src="event-effects.js?v=9.2.29"></script>
  <script src="audio-capabilities.js?v=9.2.29"></script>
  <script src="narration.js?v=9.2.29"></script>
  <script src="ambient.js?v=9.2.29"></script>
  <script src="dice-sfx.js?v=9.2.29"></script>
  <script src="app.js?v=9.2.29"></script>
</body>
</html>
