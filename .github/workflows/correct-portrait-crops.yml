name: Correct portrait crops
on:
  push:
    branches: [fix-real-portrait-files-v10-0-58]
permissions:
  contents: write
jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('Assets/Images/TombUI/v3')
          im=Image.open(p/'portraits.webp')
          cw=im.width//4
          ch=im.height//3
          for i,name in enumerate(['leader','rifleman','melee','heavy']):
              im.crop((i*cw,0,(i+1)*cw,ch)).save(p/f'portrait-{name}.webp','WEBP',quality=95,method=6)
          print(im.size, (cw,ch))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Images/TombUI/v3/portrait-*.webp
          git commit -m "Correct portraits to one source row"
          git push
