name: Apply PR 249 narration fix v2

on:
  push:
    branches:
      - codex/fix-consecutive-tomb-event-narration-queue

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          p = Path('narration.js')
          s = p.read_text(encoding='utf-8')
          pattern = r"  function stop\(\) \{\n    eventQueueGeneration \+= 1;\n    eventQueue\.splice\(0\)\.forEach\(item => item\.resolve\(false\)\);\n    eventQueueRunning = false;\n    playbackRequest \+= 1;\n    stopAudio\(\);\n  \}"
          repl = """  function clearEventQueue() {
            eventQueueGeneration += 1;
            eventQueue.splice(0).forEach(item => item.resolve(false));
            eventQueueRunning = false;
          }

          function stop() {
            clearEventQueue();
            playbackRequest += 1;
            stopAudio();
          }"""
          s, n = re.subn(pattern, textwrap.dedent(repl), s, count=1)
          if n != 1: raise SystemExit(f'stop replacement count={n}')

          old = "  async function playEntry(id, duplicateKey, manual) {\n    if (!isEnabled()) return false;\n    if (!manual && automaticPlayback.has(duplicateKey)) return false;\n    if (!manual) automaticPlayback.add(duplicateKey);\n    const request = ++playbackRequest;"
          new = "  async function playEntry(id, duplicateKey, manual, preemptEventQueue = true) {\n    if (!isEnabled()) return false;\n    if (!manual && automaticPlayback.has(duplicateKey)) return false;\n    if (!manual) automaticPlayback.add(duplicateKey);\n    if (preemptEventQueue) clearEventQueue();\n    const request = ++playbackRequest;"
          if old not in s: raise SystemExit('playEntry signature block not found')
          s = s.replace(old, new, 1)

          old = "      const started = await playEntry(item.id, item.duplicateKey, true);"
          if old not in s: raise SystemExit('queued playEntry call not found')
          s = s.replace(old, "      const started = await playEntry(item.id, item.duplicateKey, true, false);", 1)
          p.write_text(s, encoding='utf-8')

          for name in ('app.js', 'service-worker.js'):
              p = Path(name); s = p.read_text(encoding='utf-8')
              old = "const APP_VERSION = '8.6.63';"
              if s.count(old) != 1: raise SystemExit(f'{name}: APP_VERSION count={s.count(old)}')
              p.write_text(s.replace(old, "const APP_VERSION = '8.6.64';", 1), encoding='utf-8')

          p = Path('index.html'); s = p.read_text(encoding='utf-8')
          if '8.6.63' not in s: raise SystemExit('index.html has no 8.6.63 refs')
          p.write_text(s.replace('8.6.63', '8.6.64'), encoding='utf-8')

          p = Path('README.md'); s = p.read_text(encoding='utf-8')
          marker = '# Tomb World Solo Guide v8.6.63\n\n## v8.6.63\n'
          replacement = '''# Tomb World Solo Guide v8.6.64

          ## v8.6.64

          **Version 8.6.64 - Queue Consecutive Tomb Event Narration**

          - Queues consecutive automatic Tomb Event narration so every event plays in order without overlap.
          - Clears pending Tomb Event narration when mission narration or Replay Last preempts playback.
          - Preserves the v8.6.63 production Tomb Event audio and manifest-driven offline narration caching.

          ## v8.6.63
          '''
          replacement = textwrap.dedent(replacement)
          if marker not in s: raise SystemExit('README current header marker not found')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')

          test = r'''import subprocess
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          class NarrationQueuePreemptionTests(unittest.TestCase):
              def test_intro_outcome_and_replay_clear_stale_event_queue(self):
                  script = r"""
          const fs = require('fs');
          const vm = require('vm');
          const calls = [];
          let active = 0;
          class Audio {
            constructor(){ this.src=''; this.volume=.8; this.onended=null; this.onerror=null; Audio.instance=this; }
            pause(){ active=0; }
            removeAttribute(){ this.src=''; }
            load(){}
            play(){ if(active) throw new Error('overlap'); active=1; calls.push(this.src); return Promise.resolve(); }
            end(){ active=0; if(this.onended) this.onended(); }
          }
          const entries={
            'event.subjugation-glyphs':{available:true,file:'events/subjugation-glyphs.mp3'},
            'event.living-metal-flux':{available:true,file:'events/living-metal-flux.mp3'},
            'mission.01.intro':{available:true,file:'missions/01.mp3'},
            'outcome.01.victory':{available:true,file:'outcomes/01-victory.mp3'}
          };
          const context={Audio,URL,location:{href:'https://example.test/app/'},fetch:async()=>({ok:true,json:async()=>({entries})}),localStorage:{getItem:()=>null,setItem:()=>{}},dispatchEvent:()=>{},CustomEvent:function(){}};
          context.window=context; vm.createContext(context); vm.runInContext(fs.readFileSync('narration.js','utf8'),context);
          const flush=()=>new Promise(r=>setTimeout(r,0));
          async function check(label, preempt){
            const first=context.TombWorldNarration.playEvent('subjugation-glyphs',label+'-1');
            const queued=context.TombWorldNarration.playEvent('living-metal-flux',label+'-2');
            await flush();
            const before=calls.length;
            if(!await preempt()) throw new Error(label+' preemption failed');
            if(await queued) throw new Error(label+' queued event not cleared');
            await first; await flush();
            if(calls.slice(before).some(x=>x.endsWith('events/living-metal-flux.mp3'))) throw new Error(label+' stale event played');
            Audio.instance.end(); await flush();
          }
          (async()=>{
            const n=context.TombWorldNarration; await n.init();
            await check('intro',()=>n.playMissionIntro('shifting-labyrinth',true));
            await check('outcome',()=>n.playOutcome('shifting-labyrinth','victory'));
            const first=n.playEvent('subjugation-glyphs','replay-1');
            const queued=n.playEvent('living-metal-flux','replay-2');
            await flush(); const before=calls.length;
            if(!await n.replayLast()) throw new Error('replay failed');
            if(await queued) throw new Error('replay queued event not cleared');
            await first; await flush();
            if(calls.slice(before).some(x=>x.endsWith('events/living-metal-flux.mp3'))) throw new Error('replay stale event played');
            Audio.instance.end();
          })().catch(e=>{console.error(e);process.exit(1);});
          """
                  result=subprocess.run(['node','-e',script],cwd=ROOT,text=True,capture_output=True)
                  self.assertEqual(0,result.returncode,result.stderr)

          if __name__=='__main__': unittest.main()
          '''
          Path('tests/test_v8664_narration_queue_preemption.py').write_text(textwrap.dedent(test), encoding='utf-8')
          PY

      - name: Remove temporary workflows
        run: rm -f .github/workflows/pr249-direct-fix.yml .github/workflows/pr249-direct-fix-v2.yml

      - name: Validate
        shell: bash
        run: |
          node --check narration.js
          python -m unittest tests.test_v8663_consecutive_event_narration tests.test_v8664_narration_queue_preemption tests.test_v8657_narration_framework tests.test_v8660_mission_narration_timing tests.test_v8659_narration_mobile_offline
          git diff --check
          grep -q "const APP_VERSION = '8.6.64';" app.js
          grep -q "const APP_VERSION = '8.6.64';" service-worker.js
          grep -q 'narration.js?v=8.6.64' index.html
          grep -q '^# Tomb World Solo Guide v8.6.64$' README.md

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'chatgpt-direct-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix narration queue preemption and bump v8.6.64'
          git push origin HEAD:codex/fix-consecutive-tomb-event-narration-queue
