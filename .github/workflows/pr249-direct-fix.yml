name: Apply PR 249 narration fix

on:
  push:
    branches:
      - codex/fix-consecutive-tomb-event-narration-queue

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply queue preemption fix and v8.6.64 release bump
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Narration queue preemption fix.
          path = Path('narration.js')
          text = path.read_text(encoding='utf-8')

          old_stop = """  function stop() {
            eventQueueGeneration += 1;
            eventQueue.splice(0).forEach(item => item.resolve(false));
            eventQueueRunning = false;
            playbackRequest += 1;
            stopAudio();
          }
          """
          new_stop = """  function clearEventQueue() {
            eventQueueGeneration += 1;
            eventQueue.splice(0).forEach(item => item.resolve(false));
            eventQueueRunning = false;
          }

          function stop() {
            clearEventQueue();
            playbackRequest += 1;
            stopAudio();
          }
          """
          if old_stop not in text:
              raise SystemExit('Expected stop() block not found in narration.js')
          text = text.replace(old_stop, new_stop, 1)

          old_sig = "  async function playEntry(id, duplicateKey, manual) {\n    if (!isEnabled()) return false;\n    if (!manual && automaticPlayback.has(duplicateKey)) return false;\n    if (!manual) automaticPlayback.add(duplicateKey);\n    const request = ++playbackRequest;"
          new_sig = "  async function playEntry(id, duplicateKey, manual, preemptEventQueue = true) {\n    if (!isEnabled()) return false;\n    if (!manual && automaticPlayback.has(duplicateKey)) return false;\n    if (!manual) automaticPlayback.add(duplicateKey);\n    if (preemptEventQueue) clearEventQueue();\n    const request = ++playbackRequest;"
          if old_sig not in text:
              raise SystemExit('Expected playEntry() block not found in narration.js')
          text = text.replace(old_sig, new_sig, 1)

          old_event_call = "      const started = await playEntry(item.id, item.duplicateKey, true);"
          new_event_call = "      const started = await playEntry(item.id, item.duplicateKey, true, false);"
          if old_event_call not in text:
              raise SystemExit('Expected event queue playEntry call not found')
          text = text.replace(old_event_call, new_event_call, 1)
          path.write_text(text, encoding='utf-8')

          # 2. Version bump. Keep SAVE_VERSION untouched.
          replacements = {
              'app.js': ("const APP_VERSION = '8.6.63';", "const APP_VERSION = '8.6.64';"),
              'service-worker.js': ("const APP_VERSION = '8.6.63';", "const APP_VERSION = '8.6.64';"),
          }
          for filename, (old, new) in replacements.items():
              p = Path(filename)
              data = p.read_text(encoding='utf-8')
              if data.count(old) != 1:
                  raise SystemExit(f'Expected exactly one current APP_VERSION in {filename}, found {data.count(old)}')
              p.write_text(data.replace(old, new, 1), encoding='utf-8')

          p = Path('index.html')
          data = p.read_text(encoding='utf-8')
          if '8.6.63' not in data:
              raise SystemExit('Expected v8.6.63 references in index.html')
          p.write_text(data.replace('8.6.63', '8.6.64'), encoding='utf-8')

          p = Path('README.md')
          data = p.read_text(encoding='utf-8')
          marker = "# Tomb World Solo Guide v8.6.63\n\n## v8.6.63\n"
          replacement = """# Tomb World Solo Guide v8.6.64

          ## v8.6.64

          **Version 8.6.64 - Queue Consecutive Tomb Event Narration**

          - Queues consecutive automatic Tomb Event narration so every event plays in order without overlap.
          - Clears pending Tomb Event narration when mission narration or Replay Last preempts playback.
          - Preserves the v8.6.63 production Tomb Event audio and manifest-driven offline narration caching.

          ## v8.6.63
          """
          if marker not in data:
              raise SystemExit('Expected v8.6.63 README header not found')
          p.write_text(data.replace(marker, replacement, 1), encoding='utf-8')

          # 3. Add focused behavioral regression coverage for queue preemption.
          test = r'''import subprocess
          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          class NarrationQueuePreemptionTests(unittest.TestCase):
              def test_non_event_narration_clears_pending_event_queue(self):
                  script = r"""
          const fs = require('fs');
          const vm = require('vm');
          const calls = [];
          let active = 0;

          class Audio {
            constructor() { this.src = ''; this.volume = .8; this.onended = null; this.onerror = null; Audio.instance = this; }
            pause() { active = 0; }
            removeAttribute() { this.src = ''; }
            load() {}
            play() {
              if (active) throw new Error('narration tracks overlapped');
              active = 1;
              calls.push(this.src);
              return Promise.resolve();
            }
            end() { active = 0; if (this.onended) this.onended(); }
          }

          const entries = {
            'event.subjugation-glyphs': { available: true, file: 'events/subjugation-glyphs.mp3' },
            'event.living-metal-flux': { available: true, file: 'events/living-metal-flux.mp3' },
            'mission.01.intro': { available: true, file: 'missions/01.mp3' },
            'outcome.01.victory': { available: true, file: 'outcomes/01-victory.mp3' }
          };
          const context = {
            Audio, URL, location: { href: 'https://example.test/app/' },
            fetch: async () => ({ ok: true, json: async () => ({ entries }) }),
            localStorage: { getItem: () => null, setItem: () => {} },
            dispatchEvent: () => {}, CustomEvent: function () {}
          };
          context.window = context;
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('narration.js', 'utf8'), context);
          const flush = () => new Promise(resolve => setTimeout(resolve, 0));

          async function assertPreemption(label, preempt) {
            const firstId = `${label}-first`;
            const queuedId = `${label}-queued`;
            const first = context.TombWorldNarration.playEvent('subjugation-glyphs', firstId);
            const queued = context.TombWorldNarration.playEvent('living-metal-flux', queuedId);
            await flush();
            if (!calls.at(-1)?.endsWith('events/subjugation-glyphs.mp3')) throw new Error(`${label}: first event did not start`);
            const before = calls.length;
            const result = await preempt();
            if (!result) throw new Error(`${label}: preempting narration did not start`);
            if (await queued) throw new Error(`${label}: queued event was not cleared`);
            await first;
            await flush();
            if (calls.slice(before).some(src => src.endsWith('events/living-metal-flux.mp3'))) throw new Error(`${label}: stale queued event played`);
            Audio.instance.end();
            await flush();
          }

          (async () => {
            const narration = context.TombWorldNarration;
            await narration.init();

            await assertPreemption('intro', () => narration.playMissionIntro('shifting-labyrinth', true));
            if (!calls.at(-1).endsWith('missions/01.mp3')) throw new Error('mission intro path changed');

            await assertPreemption('outcome', () => narration.playOutcome('shifting-labyrinth', 'victory'));
            if (!calls.at(-1).endsWith('outcomes/01-victory.mp3')) throw new Error('mission outcome path changed');

            const replayFirst = narration.playEvent('subjugation-glyphs', 'replay-first');
            const replayQueued = narration.playEvent('living-metal-flux', 'replay-queued');
            await flush();
            const beforeReplay = calls.length;
            if (!await narration.replayLast()) throw new Error('Replay Last did not start');
            if (await replayQueued) throw new Error('Replay Last did not clear queued event');
            await replayFirst;
            await flush();
            if (!calls.at(-1).endsWith('events/subjugation-glyphs.mp3')) throw new Error('Replay Last did not replay the active event');
            if (calls.slice(beforeReplay).some(src => src.endsWith('events/living-metal-flux.mp3'))) throw new Error('stale queued event played after Replay Last');
            Audio.instance.end();

            const fresh = narration.playEvent('living-metal-flux', 'fresh-after-preemption');
            await flush();
            if (!calls.at(-1).endsWith('events/living-metal-flux.mp3')) throw new Error('fresh event did not start after preemption cleanup');
            Audio.instance.end();
            if (!await fresh) throw new Error('fresh event was not reported as played');
          })().catch(error => { console.error(error); process.exit(1); });
          """
                  result = subprocess.run(['node', '-e', script], cwd=ROOT, text=True, capture_output=True)
                  self.assertEqual(0, result.returncode, result.stderr)


          if __name__ == '__main__':
              unittest.main()
          '''
          # Dedent the embedded Python source while preserving the JS string indentation.
          import textwrap
          Path('tests/test_v8664_narration_queue_preemption.py').write_text(textwrap.dedent(test), encoding='utf-8')
          PY

      - name: Remove one-time workflow from final branch state
        shell: bash
        run: rm -f .github/workflows/pr249-direct-fix.yml

      - name: Validate focused narration changes
        shell: bash
        run: |
          node --check narration.js
          python -m unittest \
            tests.test_v8663_consecutive_event_narration \
            tests.test_v8664_narration_queue_preemption \
            tests.test_v8657_narration_framework \
            tests.test_v8660_mission_narration_timing \
            tests.test_v8659_narration_mobile_offline
          git diff --check
          grep -q "const APP_VERSION = '8.6.64';" app.js
          grep -q "const APP_VERSION = '8.6.64';" service-worker.js
          grep -q 'narration.js?v=8.6.64' index.html
          grep -q '^# Tomb World Solo Guide v8.6.64$' README.md
          ! grep -q "const APP_VERSION = '8.6.63';" app.js
          ! grep -q "const APP_VERSION = '8.6.63';" service-worker.js

      - name: Commit directly to PR branch
        shell: bash
        run: |
          git config user.name 'chatgpt-direct-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'Fix narration queue preemption and bump v8.6.64'
          git push origin HEAD:codex/fix-consecutive-tomb-event-narration-queue
