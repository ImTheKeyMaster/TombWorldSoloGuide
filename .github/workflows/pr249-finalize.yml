name: Finalize PR 249 fix

on:
  push:
    branches:
      - codex/fix-consecutive-tomb-event-narration-queue

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release updates and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = "const APP_VERSION = '8.6.63';"
          assert s.count(old) == 1, f'app.js APP_VERSION count: {s.count(old)}'
          p.write_text(s.replace(old, "const APP_VERSION = '8.6.64';", 1), encoding='utf-8')

          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          old = "const CACHE = 'tomb-world-solo-guide-v8.6.63';"
          assert s.count(old) == 1, f'service-worker cache count: {s.count(old)}'
          p.write_text(s.replace(old, "const CACHE = 'tomb-world-solo-guide-v8.6.64';", 1), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert s.count('8.6.63') == 4, f'index.html v8.6.63 count: {s.count("8.6.63")}'
          p.write_text(s.replace('8.6.63', '8.6.64'), encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          marker = '# Tomb World Solo Guide v8.6.63\n\n## v8.6.63\n'
          assert marker in s, 'README v8.6.63 header not found'
          replacement = '''# Tomb World Solo Guide v8.6.64

          ## v8.6.64

          **Version 8.6.64 - Consecutive Tomb Event Narration Queue**

          - Queues consecutive automatic Tomb Event narration so every event plays in order without overlap.
          - Clears pending Tomb Event narration when mission narration or Replay Last preempts playback.
          - Preserves the v8.6.63 production Tomb Event audio, manifest-driven offline caching, and save compatibility.

          ## v8.6.63
          '''
          s = s.replace(marker, textwrap.dedent(replacement), 1)
          p.write_text(s, encoding='utf-8')

          test = r'''import subprocess
          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          class NarrationQueuePreemptionTests(unittest.TestCase):
              def test_non_event_narration_clears_pending_event_queue(self):
                  script = r"""
          const fs = require('fs');
          const vm = require('vm');
          const calls = [];
          let active = 0;

          class Audio {
            constructor() { this.src = ''; this.volume = .8; this.onended = null; this.onerror = null; Audio.instance = this; }
            pause() { active = 0; }
            removeAttribute() { this.src = ''; }
            load() {}
            play() {
              if (active) throw new Error('narration tracks overlapped');
              active = 1;
              calls.push(this.src);
              return Promise.resolve();
            }
            end() { active = 0; if (this.onended) this.onended(); }
          }

          const entries = {
            'event.subjugation-glyphs': { available: true, file: 'events/subjugation-glyphs.mp3' },
            'event.living-metal-flux': { available: true, file: 'events/living-metal-flux.mp3' },
            'mission.01.intro': { available: true, file: 'missions/01.mp3' },
            'outcome.01.victory': { available: true, file: 'outcomes/01-victory.mp3' }
          };
          const context = {
            Audio, URL, location: { href: 'https://example.test/app/' },
            fetch: async () => ({ ok: true, json: async () => ({ entries }) }),
            localStorage: { getItem: () => null, setItem: () => {} },
            dispatchEvent: () => {}, CustomEvent: function () {}
          };
          context.window = context;
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('narration.js', 'utf8'), context);
          const flush = () => new Promise(resolve => setTimeout(resolve, 0));

          async function settleActive() {
            Audio.instance.end();
            await flush();
          }

          async function runPreemption(label, preempt, expectedSuffix) {
            const narration = context.TombWorldNarration;
            const first = narration.playEvent('subjugation-glyphs', `${label}-first`);
            const queued = narration.playEvent('living-metal-flux', `${label}-queued`);
            await flush();
            if (!calls.at(-1)?.endsWith('events/subjugation-glyphs.mp3')) throw new Error(`${label}: first event did not start`);
            const before = calls.length;
            const result = await preempt();
            if (!result) throw new Error(`${label}: preempting narration did not start`);
            if (await queued) throw new Error(`${label}: queued event was not cleared`);
            await first;
            await flush();
            if (!calls.at(-1)?.endsWith(expectedSuffix)) throw new Error(`${label}: wrong preempting narration`);
            if (calls.slice(before).some(src => src.endsWith('events/living-metal-flux.mp3'))) throw new Error(`${label}: stale queued event played`);
            await settleActive();
          }

          (async () => {
            const narration = context.TombWorldNarration;
            await narration.init();

            await runPreemption('intro', () => narration.playMissionIntro('shifting-labyrinth', true), 'missions/01.mp3');
            await runPreemption('outcome', () => narration.playOutcome('shifting-labyrinth', 'victory'), 'outcomes/01-victory.mp3');

            const replayFirst = narration.playEvent('subjugation-glyphs', 'replay-first');
            const replayQueued = narration.playEvent('living-metal-flux', 'replay-queued');
            await flush();
            const beforeReplay = calls.length;
            if (!await narration.replayLast()) throw new Error('Replay Last did not start');
            if (await replayQueued) throw new Error('Replay Last did not clear queued event');
            await replayFirst;
            await flush();
            if (!calls.at(-1)?.endsWith('events/subjugation-glyphs.mp3')) throw new Error('Replay Last did not replay active event');
            if (calls.slice(beforeReplay).some(src => src.endsWith('events/living-metal-flux.mp3'))) throw new Error('stale queued event played after Replay Last');
            await settleActive();

            const stopFirst = narration.playEvent('subjugation-glyphs', 'stop-first');
            const stopQueued = narration.playEvent('living-metal-flux', 'stop-queued');
            await flush();
            narration.stop();
            if (await stopQueued) throw new Error('stop() did not clear queued event');
            await stopFirst;

            const fresh = narration.playEvent('living-metal-flux', 'fresh-after-stop');
            await flush();
            if (!calls.at(-1)?.endsWith('events/living-metal-flux.mp3')) throw new Error('fresh event did not start after cleanup');
            await settleActive();
            if (!await fresh) throw new Error('fresh event was not reported as played');
          })().catch(error => { console.error(error); process.exit(1); });
          """
                  result = subprocess.run(['node', '-e', script], cwd=ROOT, text=True, capture_output=True)
                  self.assertEqual(0, result.returncode, result.stderr)


          if __name__ == '__main__':
              unittest.main()
          '''
          Path('tests/test_v8664_narration_queue_preemption.py').write_text(textwrap.dedent(test), encoding='utf-8')
          PY

      - name: Validate focused narration changes
        shell: bash
        run: |
          node --check narration.js
          python -m unittest \
            tests.test_v8663_consecutive_event_narration \
            tests.test_v8664_narration_queue_preemption \
            tests.test_v8657_narration_framework \
            tests.test_v8660_mission_narration_timing \
            tests.test_v8659_narration_mobile_offline
          git diff --check
          grep -q "const APP_VERSION = '8.6.64';" app.js
          grep -q "const SAVE_VERSION = 3;" app.js
          grep -q "tomb-world-solo-guide-v8.6.64" service-worker.js
          grep -q 'styles.css?v=8.6.64' index.html
          grep -q 'narration.js?v=8.6.64' index.html
          grep -q 'app.js?v=8.6.64' index.html
          grep -q '>v8.6.64<' index.html
          grep -q '^# Tomb World Solo Guide v8.6.64$' README.md

      - name: Commit changes to PR branch
        shell: bash
        run: |
          git config user.name 'chatgpt-pr-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js service-worker.js index.html README.md tests/test_v8664_narration_queue_preemption.py
          git commit -m 'Finalize narration queue fix and bump v8.6.64'
          git push origin HEAD:codex/fix-consecutive-tomb-event-narration-queue
