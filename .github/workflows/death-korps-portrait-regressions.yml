name: Death Korps portrait regression checks

on:
  pull_request:
    paths:
      - app.js
      - service-worker.js
      - index.html
      - styles.css
      - fight-portrait-scale.js
      - tests/test_v100182_native_death_korps_photos.py
      - tests/test_v100183_unified_native_portraits.py
      - tests/test_v100187_fight_result_portrait_baseline.py
      - tests/test_v100188_death_korps_fight_downward_position.py
      - tests/test_v100189_large_fight_portraits.py
      - tests/test_v100190_death_korps_necron_equal_scale.py
      - tests/test_v100191_fight_physical_miniature_scale.py
      - tests/test_v100164_experimental_death_korps_portraits.py
      - tests/test_v100145_death_korps_preload.py
      - tests/test_v100153_promote_combat_features.py
      - tests/test_v100195_october_terrain_guidance.py
      - tests/test_v100197_official_faction_rules.py
      - tests/test_v100198_jointops_specialists.py
      - tests/test_v100199_experimental_fight_exchange.py
      - tests/test_v100201_chronological_fight_exchange.py
      - tests/test_v100203_fight_auto_strike_clarity.py
      - tests/test_v100204_pwa_offline_cold_start.py
      - tests/test_v100198_jointops_npo_profiles.py
      - tests/test_aggressive_defense_d3.py
      - tests/test_v1009_aggressive_defence_result_display.py
      - tests/test_v9231_ceaseless_scuttling_mode_behavior.py
      - tests/test_v9262_ceaseless_scuttling_actions.py
      - Player_Operatives/DeathWatch.json
      - Player_Operatives/SpectreSquad.json
      - tests/test_v100194_single_necron_weapon_readonly.py
      - tests/test_weapon_selection_required.py
      - tests/test_v100206_experimental_fight_duel_layout.py
      - tests/test_v100207_experimental_fight_panel_borders.py
      - tests/test_v100208_horizontal_exchange_actions.py
      - tests/test_v100209_experimental_fight_heading_icons.py
      - tests/test_v100211_compact_fight_exchange_rail.py
      - tests/test_v100212_compact_numbered_actions.py
  push:
    branches:
      - main
    paths:
      - app.js
      - service-worker.js
      - index.html
      - styles.css
      - fight-portrait-scale.js
      - tests/test_v100182_native_death_korps_photos.py
      - tests/test_v100183_unified_native_portraits.py
      - tests/test_v100187_fight_result_portrait_baseline.py
      - tests/test_v100188_death_korps_fight_downward_position.py
      - tests/test_v100189_large_fight_portraits.py
      - tests/test_v100190_death_korps_necron_equal_scale.py
      - tests/test_v100191_fight_physical_miniature_scale.py
      - tests/test_v100164_experimental_death_korps_portraits.py
      - tests/test_v100153_promote_combat_features.py
      - tests/test_v100195_october_terrain_guidance.py
      - tests/test_v100197_official_faction_rules.py
      - tests/test_v100198_jointops_specialists.py
      - tests/test_v100199_experimental_fight_exchange.py
      - tests/test_v100201_chronological_fight_exchange.py
      - tests/test_v100203_fight_auto_strike_clarity.py
      - tests/test_v100204_pwa_offline_cold_start.py
      - tests/test_v100198_jointops_npo_profiles.py
      - tests/test_aggressive_defense_d3.py
      - tests/test_v1009_aggressive_defence_result_display.py
      - tests/test_v9231_ceaseless_scuttling_mode_behavior.py
      - tests/test_v9262_ceaseless_scuttling_actions.py
      - Player_Operatives/DeathWatch.json
      - Player_Operatives/SpectreSquad.json
      - tests/test_v100194_single_necron_weapon_readonly.py
      - tests/test_weapon_selection_required.py
      - tests/test_v100206_experimental_fight_duel_layout.py
      - tests/test_v100207_experimental_fight_panel_borders.py
      - tests/test_v100208_horizontal_exchange_actions.py
      - tests/test_v100209_experimental_fight_heading_icons.py
      - tests/test_v100211_compact_fight_exchange_rail.py
      - tests/test_v100212_compact_numbered_actions.py
  workflow_dispatch:

jobs:
  verify-portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: |
          node --check app.js
          node --check service-worker.js
          node --check fight-portrait-scale.js
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check Death Korps and combat regression tests
        run: |
          python -m pytest -q \
            tests/test_v100164_experimental_death_korps_portraits.py \
            tests/test_v100182_native_death_korps_photos.py \
            tests/test_v100183_unified_native_portraits.py \
            tests/test_v100186_fight_miniature_baseline.py \
            tests/test_v100187_fight_result_portrait_baseline.py \
            tests/test_v100188_death_korps_fight_downward_position.py \
            tests/test_v100189_large_fight_portraits.py \
            tests/test_v100190_death_korps_necron_equal_scale.py \
            tests/test_v100191_fight_physical_miniature_scale.py \
            tests/test_v100145_death_korps_preload.py \
            tests/test_v100140_death_korps_activation_framing.py \
            tests/test_v100141_npo_player_target_rail.py \
            tests/test_v100153_promote_combat_features.py \
            tests/test_v100195_october_terrain_guidance.py \
            tests/test_v100197_official_faction_rules.py \
            tests/test_v100198_jointops_specialists.py \
            tests/test_v100199_experimental_fight_exchange.py \
            tests/test_v100201_chronological_fight_exchange.py \
            tests/test_v100203_fight_auto_strike_clarity.py \
            tests/test_v100204_pwa_offline_cold_start.py \
            tests/test_v100198_jointops_npo_profiles.py \
            tests/test_aggressive_defense_d3.py \
            tests/test_v1009_aggressive_defence_result_display.py \
            tests/test_v9231_ceaseless_scuttling_mode_behavior.py \
            tests/test_v9262_ceaseless_scuttling_actions.py \
            tests/test_v100150_experimental_weapon_guidance_selection.py \
            tests/test_v100157_experimental_weapon_rules_selection.py \
            tests/test_v100194_single_necron_weapon_readonly.py \
            tests/test_v8629_player_multitarget_combat_resume.py \
            tests/test_v851_guided_combat_resume.py \
            tests/test_weapon_selection_required.py \
            tests/test_v100206_experimental_fight_duel_layout.py \
            tests/test_v100207_experimental_fight_panel_borders.py \
            tests/test_v100208_horizontal_exchange_actions.py \
            tests/test_v100209_experimental_fight_heading_icons.py \
            tests/test_v100211_compact_fight_exchange_rail.py \
            tests/test_v100212_compact_numbered_actions.py
