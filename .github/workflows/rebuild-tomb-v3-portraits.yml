name: Rebuild Tomb UI v3 portraits

on:
  push:
    branches:
      - tomb-ui-v3-art-pack
    paths:
      - 'Assets/Images/TombUI/v3/source/portraits-corrupt.webp'
      - 'tools/rebuild_tomb_v3_portraits.py'
      - '.github/workflows/rebuild-tomb-v3-portraits.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tomb-ui-v3-art-pack
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild generated portrait sprite
        run: python tools/rebuild_tomb_v3_portraits.py
      - name: Commit generated sprite
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assets/Images/TombUI/v3
          git commit -m "Build Tomb UI v3 portrait sprite"
          git push
