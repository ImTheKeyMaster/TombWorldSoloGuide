name: Verify PR 249 final narration fix

on:
  push:
    branches:
      - codex/fix-consecutive-tomb-event-narration-queue

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh stale release assertions
        shell: bash
        run: |
          sed -i 's/8\.6\.63/8.6.64/g' tests/test_v8657_narration_framework.py tests/test_v8660_mission_narration_timing.py
          git config user.name 'chatgpt-pr-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_v8657_narration_framework.py tests/test_v8660_mission_narration_timing.py
          if ! git diff --cached --quiet; then
            git commit -m 'Update narration release assertions for v8.6.64'
            git push origin HEAD:codex/fix-consecutive-tomb-event-narration-queue
          fi
      - name: Syntax
        run: node --check narration.js
      - name: Consecutive event queue regression
        run: python -m unittest tests.test_v8663_consecutive_event_narration
      - name: Queue preemption regression
        run: python -m unittest tests.test_v8664_narration_queue_preemption
      - name: Narration framework regression
        run: python -m unittest tests.test_v8657_narration_framework
      - name: Mission narration timing regression
        run: python -m unittest tests.test_v8660_mission_narration_timing
      - name: Mobile offline narration regression
        run: python -m unittest tests.test_v8659_narration_mobile_offline
