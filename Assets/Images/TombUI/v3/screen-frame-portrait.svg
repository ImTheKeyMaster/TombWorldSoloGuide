    <stop stop-color="#111918"/><stop offset=".18" stop-color="#485351"/><stop offset=".33" stop-color="#0a0f0f"/>
    <stop offset=".55" stop-color="#252e2d"/><stop offset=".76" stop-color="#060a0a"/><stop offset="1" stop-color="#606966"/>
  </linearGradient>
  <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#89928e"/><stop offset=".16" stop-color="#252d2b"/><stop offset=".54" stop-color="#0a0e0d"/>
    <stop offset=".83" stop-color="#414b48"/><stop offset="1" stop-color="#0d1211"/>
