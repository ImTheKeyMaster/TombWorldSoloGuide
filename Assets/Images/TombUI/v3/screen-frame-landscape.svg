  <radialGradient id="emerald" cx=".5" cy=".5" r=".65">
    <stop stop-color="#bdffd5"/><stop offset=".28" stop-color="#51ff9b"/><stop offset=".7" stop-color="#0d7548"/><stop offset="1" stop-color="#020e09"/>
  </radialGradient>
  <pattern id="grain" width="13" height="13" patternUnits="userSpaceOnUse">
    <path d="M0 11L11 0M6 13L13 6" stroke="#d1d8d5" stroke-opacity=".045" stroke-width=".7"/>
    <circle cx="3" cy="4" r=".6" fill="#fff" fill-opacity=".03"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1170" height="556" fill="none"/>

