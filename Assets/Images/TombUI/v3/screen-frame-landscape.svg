<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 556" preserveAspectRatio="none" data-frame-style="graphical-v1">
<defs>
  <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#101716"/><stop offset=".18" stop-color="#515b58"/><stop offset=".34" stop-color="#080d0c"/>
    <stop offset=".58" stop-color="#26302e"/><stop offset=".8" stop-color="#050908"/><stop offset="1" stop-color="#66706c"/>
  </linearGradient>
  <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#8b9490"/><stop offset=".16" stop-color="#2b3331"/><stop offset=".52" stop-color="#0a0e0d"/>
    <stop offset=".83" stop-color="#46504c"/><stop offset="1" stop-color="#0c1110"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#07291d"/><stop offset=".22" stop-color="#42ef91"/><stop offset=".5" stop-color="#b6ffd2"/>
    <stop offset=".78" stop-color="#3be88d"/><stop offset="1" stop-color="#08291e"/>
