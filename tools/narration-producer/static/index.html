<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tomb World Narration Producer</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">LOCAL PRODUCTION TOOL</p><h1>Tomb World Narration Producer</h1><p id="localWarning" hidden>Tomb World Narration Producer must be run locally using RUN_NARRATION_PRODUCER.bat.</p></header><section class="panel"><div class="status">API Key: <strong id="keyStatus">Checking…</strong></div><div class="buttons"><button id="test">Test Connection</button><button id="openKey">Open API Key File</button><button id="recheck">Recheck API Key</button><button id="openFolder">Open Output Folder</button></div><label>Voice<select id="voice"><option value="">Select a voice</option></select></label><button id="preview" disabled>Preview Voice</button><audio id="voiceAudio" controls hidden></audio><label>Model<select id="model"><option value="">Select a model</option></select></label><label>Output Format<select id="format"><option>mp3_44100_128</option></select></label><details><summary>Advanced Voice Settings</summary><div class="settings"><label>Stability<input id="stability" type="number" min="0" max="1" step=".01"></label><label>Similarity<input id="similarity" type="number" min="0" max="1" step=".01"></label><label>Style<input id="style" type="number" min="0" max="1" step=".01"></label><label>Speed<input id="speed" type="number" min=".7" max="1.2" step=".01"></label><label><input id="boost" type="checkbox"> Speaker Boost</label></div></details></section><section class="toolbar"><select id="filter"><option value="all">All</option><option value="mission-intro">Mission Introductions</option><option value="event">Tomb World Events</option><option value="outcome">Outcomes</option><option value="deadly-encounter">Deadly Encounters</option><option value="grade">Threat Escalation</option></select><button id="approved">Select Approved</button><button id="dry">Dry Run Selected</button><button id="generate" disabled>Generate Selected</button></section><p id="message" role="status"></p><section id="scripts"></section><dialog id="confirm"><h2>Confirm generation</h2><div id="confirmSummary"></div><label class="consent"><input id="consent" type="checkbox"> I understand that generating these files will send the selected scripts to ElevenLabs and may consume ElevenLabs credits.</label><div class="buttons"><button id="cancelConfirm">Cancel</button><button id="finalGenerate" disabled>Generate</button></div></dialog><dialog id="plan"><h2>Dry Run</h2><div id="planBody"></div><button onclick="this.closest('dialog').close()">Close</button></dialog></main><script src="producer.js"></script></body></html>
